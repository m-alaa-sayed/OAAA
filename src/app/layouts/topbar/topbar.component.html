<header id="page-topbar" data-scroll-header>
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box mx-3">
                    <a class="navbar-brand" routerLink="/">
                        <img src="assets/images/jawda-images/logo.svg" class="card-logo card-logo-dark" alt="logo" />
                    </a>
                </div>
            </div>

            <div class="d-flex align-items-center  px-3">
                <div class="actions d-flex align-items-center">
                    <language-select></language-select>
                </div>
                <div ngbDropdown [autoClose]="false" class="dropdown topbar-head-dropdown ms-1 header-item">
                    <button type="button" ngbDropdownToggle (click)="goToUserTasks()"
                        class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                        id="page-header-notifications-dropdown" data-bs-toggle="dropdown" aria-haspopup="true"
                        aria-expanded="false">
                        <i class='bx bx-bell fs-22'></i>
                            <span
                                class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger">
                                {{ taskCount }}
                            </span>
                        </button>
                </div>

                <div class="dropdown ms-sm-3 header-item topbar-user" ngbDropdown>
                    <button type="button" class="btn" id="page-header-user-dropdown" data-bs-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false" ngbDropdownToggle>
                        <span class="d-flex align-items-center">
                            <img class="rounded-circle header-profile-user"
                                src="assets/images/jawda-images/profile-default.png" alt="profile image">
                            <span class="text-start ms-xl-2">
                                <span
                                    class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">
                                    {{ translate.currentLang === 'ar' ? userData.fullNameAr : userData.fullNameEn }}
                                </span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
                        <!-- item-->
                        <h6 class="dropdown-header">{{'PAGES.COMMON.LABELS.WELCOME' | translate}}<span class="mx-2">{{ translate.currentLang === 'ar' ? userData.fullNameAr : userData.fullNameEn }}</span></h6>
                        <a class="dropdown-item" routerLink="profile"><i
                                class="mdi mdi-account-circle text-muted fs-16 align-middle me-1"></i> <span
                                class="align-middle">{{'PAGES.COMMON.LABELS.PROFILE' | translate}}</span></a>
                        <a class="dropdown-item" href="javascript: void(0);" (click)="logout()"><i
                                class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i> <span
                                class="align-middle" data-key="t-logout">{{'PAGES.COMMON.LABELS.LOGOUT' | translate}}</span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
