<page-title [title]="title" [breadcrumbItems]="[{ label: title, active: true }]"></page-title>

<request-main-data *ngIf="mainRequestData" [mainRequestData]="mainRequestData"
        [title]="'PAGES.EXTERNAL_REVIEWER.LABELS.REGISTRATION_REQUEST_MAIN_DATA'" [showRequestType]="true">
</request-main-data>

<!-- tabs -->
<app-tabs *ngIf="requestObject && showTabs" [tabs]="tabs"></app-tabs>


<div>
        <app-recommendation-section
                [model]="requestObject.externalReviewersRegistrationRequestInfo"
                [erActivities]="erActivities"
                [module]="requestObject.oaaaService.module"
                [isEditable]="taskId"
                [canEditMetAndNotMet]="canEditMetAndNotMet"
                [isSubmitted]="isSubmitted"
                (modelChange)="requestObject.externalReviewersRegistrationRequestInfo = $event">
        </app-recommendation-section>
</div>

<app-interview-result *ngIf="externalReviewInterviewResultInfo" [externalReviewInterviewResultInfo]="externalReviewInterviewResultInfo"></app-interview-result>

<training-result *ngIf="trainingResultObj" [trainingResultObj]="trainingResultObj"></training-result>

<div class="card shadow-sm">
        <div class="card-body">
                <div class="row">
                        <div class="d-flex justify-content-end">
                                <button type="button" class="btn btn-outline-secondary"
                                        [routerLink]="['/jawda/external-reviewers/external-reviewers-candidates', this.requestObject.oaaaService.module]">
                                        {{ "PAGES.COMMON.LABELS.CANCEL" | translate }}
                                </button>
                        </div>
                </div>
        </div>
</div>

<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>
