<page-title [title]="pageTitleKey | translate"
            [breadcrumbItems]="[{ label: pageTitleKey | translate, active: true }]"
></page-title>

<div class="card shadow-sm p-3">
    <div class="card-body d-flex justify-content-end mx-0 px-0"
         *hasPermission="[Permission.VIEW_CSEQA_ER_USERS_REPORT]">
        <button class="btn btn-primary" (click)="downloadExcelReport()">
            <i class="ri-printer-fill align-bottom me-1"></i> {{ 'PAGES.COMMON.LABELS.EXPORT' | translate }}
        </button>
    </div>
    <oaaaqa-ag-grid
            [actions]="actions"
            [dataList]="requestList"
            [columns]="columns"
            [columnFilterOptions]="columnFilterOptions">
    </oaaaqa-ag-grid>
</div>
