<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>

<div class="container-fluid">
  <page-title [title]="'PAGES.LOGIN.LABELS.CHANGE_PASSWORD' | translate"
    [breadcrumbItems]="breadcrumbItems"></page-title>

  <!-- Basic Information Card -->
  <app-user-basic-info class="mb-3" [userFullData]="userFullData"></app-user-basic-info>

  <!-- Change Password Card -->
  <div class="card mb-3">
    <div class="card-header">
      <h4 class="card-title mb-0">{{ 'PAGES.CREATE_ACCOUNT.LABELS.PASSWORD' | translate }}</h4>
    </div>
    <div class="card-body">
      <form #changePasswordForm="ngForm">
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label" for="newPassword">
                {{ 'PAGES.CREATE_ACCOUNT.LABELS.PASSWORD' | translate }}
                <span class="text-danger">*</span>
              </label>
              <div class="position-relative auth-pass-inputgroup">
                <input [type]="newPasswordField ? 'text' : 'password'" class="form-control pe-5 password-input"
                  placeholder="{{ 'PAGES.CREATE_ACCOUNT.LABELS.PASSWORD' | translate }}" name="newPassword"
                  id="newPassword" #newPassword="ngModel" [(ngModel)]="changePasswordObj.newPassword" required
                  noWhitespace
                  [ngClass]="{'is-invalid': isChangePasswordSubmitting && (newPassword.invalid || !passwordPatternValid())}"
                  aria-describedby="passwordInput" [pattern]="PASSWORD_PATTERN">
                <button
                  class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon"
                  type="button" 
                  id="new-password-addon">
                    <i class="mdi align-middle" 
                      [ngClass]="{'mdi-eye-off-outline': !newPasswordField, 'mdi-eye-outline': newPasswordField}" 
                      (click)="toggleNewPasswordField()"></i>
                </button>
              </div>
              <div *ngIf="isChangePasswordSubmitting && !passwordPatternValid()" class="text-danger mt-1 small">
                {{ 'PAGES.CREATE_ACCOUNT.MESSAGES.PASSWORD_COMPLEXITY' | translate }}
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label" for="confirmPassword">
                {{ 'PAGES.CREATE_ACCOUNT.LABELS.RE_PASSWORD' | translate }}
                <span class="text-danger">*</span>
              </label>
              <div class="position-relative auth-pass-inputgroup">
                <input [type]="confirmField ? 'text' : 'password'" class="form-control pe-5 password-input"
                  placeholder="{{ 'PAGES.CREATE_ACCOUNT.LABELS.RE_PASSWORD' | translate }}" [pattern]="PASSWORD_PATTERN"
                  id="confirmPassword" name="confirmPassword" #confirmPassword="ngModel"
                  [(ngModel)]="changePasswordObj.confirmPassword" required noWhitespace
                  [ngClass]="{'is-invalid': isChangePasswordSubmitting && !passwordsMatch()}">
                <button
                  class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon"
                  type="button" 
                  id="confirm-password-addon">
                    <i class="mdi align-middle" 
                      [ngClass]="{'mdi-eye-off-outline': !confirmField, 'mdi-eye-outline': confirmField}" 
                      (click)="toggleconfirmField()"></i>
                </button>
              </div>
              <div *ngIf="isChangePasswordSubmitting && !passwordsMatch()" class="text-danger mt-1">
                {{ 'PAGES.CREATE_ACCOUNT.MESSAGES.PASSWORDS_DO_NOT_MATCH' | translate }}
              </div>
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>

  <!-- Edit History Section -->
  <app-edit-history-table [historyData]="historyData"></app-edit-history-table>

  <div class="row mb-3">
    <div class="col-12">
      <div class="d-flex justify-content-end gap-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
          {{ 'PAGES.COMMON.LABELS.CANCEL' | translate }}
        </button>
        <button *ngIf="!isPasswordChanged" type="submit" class="btn btn-success" (click)="changePassword()">
          <i class="mdi mdi-content-save"></i>
          {{ 'PAGES.COMMON.LABELS.SAVE' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
