<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>

<page-title [title]="'PAGES.PERMISSIONS_MANAGEMENT.TITLES.ROLE_PERMISSIONS' | translate"
    [breadcrumbItems]="breadCrumbItems"></page-title>

<!-- Card 1: Basic Information -->
<div class="card mb-3">
    <div class="card-header">
        <h5 class="card-title mb-0">{{ 'PAGES.PERMISSIONS_MANAGEMENT.TITLES.ROLE_DETAILS' | translate }}</h5>
    </div>
    <div class="card-body">
        <app-role-basic-info-fields 
            *ngIf="roleData"
            [roleData]="roleData" 
            [groups]="groups"
            [mode]="'readOnly'">
        </app-role-basic-info-fields>
    </div>
</div>

<!-- Card 2: Permissions List -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0">{{ 'PAGES.PERMISSIONS_MANAGEMENT.LABELS.PERMISSIONS' | translate }}</h4>
        <button class="btn btn-primary" (click)="assignPermission()">
            {{ 'PAGES.PERMISSIONS_MANAGEMENT.LABELS.ASSIGN_ROLE_PERMISSION' | translate }}
        </button>
    </div>
    <div class="card-body">
        <oaaaqa-ag-grid 
            [dataList]="permissionsList" 
            [columns]="columns" 
            [actions]="actions"
            [pagination]="true"
            [paginationPageSize]="10"
            [paginationPageSizeSelector]="[5, 10, 20]"
            [showRowNumbers]="true"
            [actionsColumnWidth]="120">
        </oaaaqa-ag-grid>
    </div>
</div>
