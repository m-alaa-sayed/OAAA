<!-- buttons -->
<div *ngIf="showButtons" class="row mt-3 mx-3">
    <div class="d-flex justify-content-between w-100">
        <!-- Left side (start) -->
        <div>
            <button type="button" class="btn btn-outline-secondary" (click)="cancelEvent.emit()">
                {{ "PAGES.COMMON.LABELS.CANCEL" | translate }}
            </button>
        </div>

        <!-- Right side (end) -->
        <div>
            <button type="button" class="btn btn-primary JU me-2"
                *ngIf="isEditable" (click)="saveEvent.emit()">
                {{ 'PAGES.COMMON.LABELS.SAVE' | translate }}
            </button>

            <button type="button" class="btn btn-primary" 
                (click)="nextEvent.emit()">
                {{ 'PAGES.COMMON.LABELS.NEXT' | translate }}
            </button>
        </div>
    </div>
</div>
