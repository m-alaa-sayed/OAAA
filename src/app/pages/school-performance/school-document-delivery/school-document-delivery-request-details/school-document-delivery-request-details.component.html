<page-title [title]="'PAGES.SCHOOL_DOCUMENT_DELIVERY.LABELS.RECEIVING_DELIVERING_SCHOOL_DOCUMENTS_EVIDENCE' |translate"
            [breadcrumbItems]="[{ label: 'PAGES.SCHOOL_DOCUMENT_DELIVERY.LABELS.RECEIVING_DELIVERING_SCHOOL_DOCUMENTS_EVIDENCE'|translate, active: true }]"></page-title>

<app-school-document-delivery-actions
        *ngIf="dto && requestObject && taskId"
        [isSchoolUser]="isSchoolUser" [isTlUser]="isTlUser"
        [taskId]="taskId" [requestObject]="requestObject" [requestInfo]="dto"
        (actionEventEmitter)="submit($event)" (showErrorAndHideSpinner)="showValidationMessage()">
</app-school-document-delivery-actions>

<request-main-data *ngIf="mainRequestData" [mainRequestData]="mainRequestData"></request-main-data>

<request-user-details *ngIf="requestObject" [applicantData]="requestObject.applicantUser"></request-user-details>

<follow-up-request *ngIf="requestObject" [requestHistoryList]="requestObject.requestHistoryList"></follow-up-request>

<app-document-delivery-item-list
        *ngIf="isDataLoaded"
        [isRequest]="!!dto.requestId"
        [isTaskAssigned]="requestObject?.serviceStep?.stepCode !== 'SCHOOL_DOCUMENT_DELIVERY_WAITING_NEW_DOC'"
        [canUpdateDocuments]="canUpdateDocuments"
        [isSchoolUser]="isSchoolUser" [isTlUser]="isTlUser" [isSubmitted]="isSubmitted"
        [schoolDocumentDeliveryItems]="dto.schoolDocumentDeliveryItems"
        (schoolDocumentDeliveryItemsEventEmitter)="updateSchoolDocumentDeliveryItems($event)">
</app-document-delivery-item-list>

<app-school-document-delivery-actions
        *ngIf="dto && requestObject && taskId"
        [isSchoolUser]="isSchoolUser" [isTlUser]="isTlUser"
        [taskId]="taskId" [requestObject]="requestObject" [requestInfo]="dto"
        (actionEventEmitter)="submit($event)" (showErrorAndHideSpinner)="showValidationMessage()">
</app-school-document-delivery-actions>

<div class="card shadow-sm" *ngIf="!taskId">
    <div class="card-body">
        <div class="row">
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-outline-secondary"
                        [routerLink]="'/jawda/school-performance/domain-summary/list'">
                    {{ "PAGES.COMMON.LABELS.CANCEL" | translate }}
                </button>
            </div>
        </div>
    </div>
</div>

<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>
