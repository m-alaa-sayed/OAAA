<page-title
        [title]="'PAGES.SCHOOL_DOCUMENT_DELIVERY.LABELS.RECEIVING_DELIVERING_SCHOOL_DOCUMENTS_EVIDENCE'  | translate"
        [breadcrumbItems]="[
            { label: '' | translate, active: true },
            { label: 'PAGES.SCHOOL_DOCUMENT_DELIVERY.LABELS.RECEIVING_DELIVERING_SCHOOL_DOCUMENTS_EVIDENCE' | translate,  active: true, link :'/jawda/school-performance/school-document-delivery/visits'}
        ]">
</page-title>

<app-school-information
        *ngIf="dto && dto.scheduledSchoolVisit && dto.scheduledSchoolVisit.school"
        [school]="dto.scheduledSchoolVisit.school">
</app-school-information>

<app-scheduled-school-visit-info
        *ngIf="dto && dto.scheduledSchoolVisit" [scheduledSchoolVisit]="dto.scheduledSchoolVisit">
</app-scheduled-school-visit-info>

<app-document-delivery-item-list
        *ngIf="isDataLoaded"
        [isRequest]="!!dto.requestId"
        [canUpdateDocuments]="canUpdateDocuments"
        [schoolDocumentDeliveryItems]="dto.schoolDocumentDeliveryItems"
        (schoolDocumentDeliveryItemsEventEmitter)="updateSchoolDocumentDeliveryItems($event)">
</app-document-delivery-item-list>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="row">
            <div class="pt-2 mx-3 d-flex justify-content-between">
                <div class="d-flex justify-content-start rounded">
                    <button type="button" class="btn btn-outline-secondary me-2 ms-2"
                            [routerLink]="'/jawda/school-performance/school-document-delivery/visits'">
                        {{ "PAGES.COMMON.LABELS.CANCEL" | translate }}
                    </button>
                </div>
                <div class="d-flex justify-content-end rounded w-25 me-3" *ngIf="canUpdateDocuments">
                    <button type="button" class="step-next btn btn-success ms-2 me-2" (click)="save('SAVE')">
                        {{ 'PAGES.COMMON.LABELS.SAVE' | translate }}
                    </button>
                    <button type="button" class="step-next btn btn-primary ms-2 me-2"
                            (click)="action='SUBMIT'; openConfirmationModal(decision)">
                        {{ 'PAGES.COMMON.LABELS.SUBMIT' | translate }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
