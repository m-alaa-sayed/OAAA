<!-- domain 1 -->
<div class="card m-4">
    <div class="card-header">
        <h5 class="card-title mb-0">{{
                "PAGES.EXTERNAL_REVIEW_VISIT_REPORTS.LABELS.AXIS_ONE" |
                    translate
            }}</h5>
    </div>
    <div class="card-body">
        <domain-standards [isEditMode]="isEditMode" [isSubmitting]="isSubmitting"
                          [canEditJudgmentAndJustification]="canEditJudgmentAndJustification"
                          [domains]="visitReportSubmissionRequestInfo.groupedDomainEvaluationDimension?.['LEARNING_QUALITY'] || []"
                          (professionalJudgmentChange)="onDomainJudgmentChange($event)">
        </domain-standards>

    </div>
</div>
