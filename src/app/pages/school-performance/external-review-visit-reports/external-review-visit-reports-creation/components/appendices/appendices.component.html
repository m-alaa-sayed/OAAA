<div class="school-performance-layout">
    <!-- Sidebar Navigation -->
    <div class="sidebar-nav">
        <div class="nav-header">
            <h3>{{ 'PAGES.SCHOOL_PERFORMANCE.NAVIGATION.TITLE' | translate }}</h3>
        </div>

        <nav class="nav-tabs">
            <button *ngFor="let tab of tabs" class="nav-tab" [class.active]="activeTab === tab.id"
                    (click)="selectTab(tab)">
                <i class="ri-arrow-left-s-line tab-arrow"></i>
                <span class="tab-label">{{ tab.label | translate }}</span>

            </button>
        </nav>
    </div>
    <!-- Main Content Area -->
    <div class="main-content">
        <!-- School Info Header -->
        <div class="school-header" *ngIf="school">
            <div class="school-details">
                <h1 class="school-name">{{ school.nameAr }}</h1>
                <div class="school-meta">
                    <div>
                        <span class="divider">•</span>
                        <span class="school-code">{{ 'MENUITEMS.MENU.SCHOOL_CODE' | translate }}
                            : {{ school.code }}</span>
                    </div>
                    <div>
                        <span class="divider">•</span>
                        <span class="school-type">{{ 'PAGES.COMMON.LABELS.' + school.type | translate }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Content -->
        <div class="tab-content-area">
            <div class="tab-content-area">

                <app-general-data *ngIf="activeTab === 'general-data'"
                                  [isViewMode]="true"
                                  [schoolInfo]="visitReportSubmissionRequestInfo.editableSchoolInfo || {}">
                </app-general-data>
                <app-student-data
                        *ngIf="activeTab === 'student-data'"
                        [isEditable]="false"
                        [schoolInfo]="visitReportSubmissionRequestInfo.editableSchoolInfo || {}">
                </app-student-data>
                <app-teaching-staff
                        *ngIf="activeTab === 'teaching-staff'"
                        [isReadonly]="true"
                        [showMajorDevelopments]="true"
                        [schoolInfo]="visitReportSubmissionRequestInfo.editableSchoolInfo || {}">
                </app-teaching-staff>
                <!-- <app-staff-data
                        *ngIf="activeTab === 'staff-data'"
                        [isEditable]="false"
                        [schoolInfo]="visitReportSubmissionRequestInfo.editableSchoolInfo || {}">
                </app-staff-data> -->
                <evidence-collection-forms-statistics
                        [groupedFormsStats]="visitReportSubmissionRequestInfo.groupedFormsStats"
                        *ngIf="activeTab === 'evidence-collection-forms-statistics'"
                >
                </evidence-collection-forms-statistics>

            </div>
        </div>
    </div>


</div>


<step-action-buttons *ngIf="showButtons" [showSubmitBtn]="false"
                     (previousEvent)="previousEvent.emit()" (saveEvent)="save()" [showSaveBtn]="showSaveBtn"
                     (nextEvent)="nextEvent.emit()"
                     (cancelEvent)="cancelEvent.emit()"></step-action-buttons>
