<div class="pt-2 mx-3 d-flex justify-content-between">

    <div class="d-flex justify-content-start rounded">
        <button *ngIf="showPreviousBtn" type="button" class="step-prev btn btn-primary" (click)="previousEvent.emit()">
            {{ 'PAGES.COMMON.LABELS.PREVIOUS' | translate }}
        </button>

        <button  type="button" class="btn btn-outline-secondary me-2 ms-2" (click)="cancelEvent.emit()">
            {{ "PAGES.COMMON.LABELS.CANCEL" | translate }}
        </button>

    </div>


    <div class="d-flex justify-content-end rounded w-25">
         <button *ngIf="showSaveBtn" type="button" class="step-next btn btn-primary ms-2 me-2" (click)="saveEvent.emit()">
            {{ 'PAGES.COMMON.LABELS.SAVE' | translate }}
        </button>

        <button *ngIf="showNextBtn" type="button" class="step-next btn btn-primary ms-2 me-2" (click)="nextEvent.emit()">
            {{ 'PAGES.COMMON.LABELS.NEXT' | translate }}
        </button>

          <button *ngIf="showSubmitBtn" type="button" class="step-next btn btn-primary ms-2 me-2" (click)="submitEvent.emit()">
            {{ 'PAGES.COMMON.LABELS.SAVE_AND_SEND' | translate }}
        </button>
    </div>
</div>
