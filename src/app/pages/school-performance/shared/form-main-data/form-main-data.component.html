<div class="card shadow-sm">
  <div class="card-header">
    <h5 class="mb-0 text-start">{{title|translate}}</h5>
  </div>
  <div class="card-body">
    <div class="row text-center align-items-center mx-5">

      <div class="col-md-4 d-flex">
        <div class="image-col">
          <span class="h-100"> <i class="ri-file-list-line fs-1 text-primary"></i></span>
        </div>
        <div>
          <h4 class="text-muted fw-semibold fs-13 d-flex justify-content-start">
            {{'PAGES.VISIT_FORM.LABELS.FORM_CODE'|translate}}</h4>
          <p class="fs-16 fw-bold text-dark">{{ mainRequestData.formCode }}</p>
        </div>
      </div>

      <div class="col-md-4 d-flex">
        <div class="image-col">
          <span class="h-100"> <i class="ri-time-line fs-1 text-primary"></i></span>
        </div>
        <div>
          <h4 class="text-muted fw-semibold fs-13 d-flex justify-content-start">
            {{'PAGES.VISIT_FORM.LABELS.FORM_DATE'|translate}}</h4>
          <p class="fs-16 fw-bold text-dark">{{ mainRequestData.formDate |date}}</p>
        </div>
      </div>


      <!-- Status -->
      <div class="col-md-4 d-flex">
        <div class="image-col">
          <span class="h-100"> <i class="ri-information-line fs-1 text-primary"></i></span>
        </div>
        <div>
          <h4 class="text-muted fw-semibold fs-13 d-flex justify-content-start">
            {{'PAGES.COMMON.LABELS.STATUS'|translate}}</h4>
          <p class="fs-16 fw-bold text-dark">{{ 'PAGES.COMMON.LABELS.'+ mainRequestData.status |translate}}</p>
        </div>
      </div>

    </div>
  </div>
</div>
