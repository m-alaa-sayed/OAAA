<page-title *ngIf="!isReport"
            [title]="'MENUITEMS.MENU.DOMAIN_SUMMARIES_MANAGEMENT' | translate"
            [breadcrumbItems]="[
            { label: domainSummaryListPageTitle | translate, link: domainSummaryListUrl, active: true, state: previousState },
            { label: 'MENUITEMS.MENU.DOMAIN_SUMMARIES_MANAGEMENT' | translate,  active: true }
        ]"></page-title>

<page-title *ngIf="isReport"
            [title]="'MENUITEMS.MENU.DOMAIN_SUMMARIES_MANAGEMENT_REPORT' | translate"
            [breadcrumbItems]="[
            { label: 'MENUITEMS.MENU.REPORTS_LIST' | translate, link: '/jawda/school-performance/reports/CSEQA', active: true },
            { label: domainSummaryListPageTitle | translate, link: domainSummaryListUrl, active: true, state: previousState },
            { label: 'MENUITEMS.MENU.DOMAIN_SUMMARIES_MANAGEMENT_REPORT' | translate,  active: true }
        ]"></page-title>

<visit-details *ngIf="visitData" [visitData]="visitData"></visit-details>

<div *hasPermission="[Permission.DOMAIN_SUMMARY_VIEW_DOMAINS_LIST]" class="card shadow-sm p-3">
    <div class="card-header d-flex align-items-center justify-content-between">
        <h5 class="mb-0 text-start">{{ 'PAGES.DOMAIN_SUMMARY.LABELS.DOMAIN_SUMMARY_RESPONSIBILITIES'|translate }}</h5>
        <button *hasPermission="[Permission.DOMAIN_SUMMARY_EXPORT_EXCEL_FOR_ALL]"
                type="button" class="link-like-btn" (click)="downloadObservationAndMonitoringFormsReport()">
            {{ 'PAGES.DOMAIN_SUMMARY.LABELS.DOWNLOAD_OBSERVATION_AND_MONITORING_FORMS_REPORT' | translate }}
        </button>
    </div>
    <oaaaqa-ag-grid [columns]="columns" [actions]="actions" [dataList]="list"></oaaaqa-ag-grid>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="row">
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-outline-secondary" (click)="navigateToDomainSummaryList()">
                    {{ "PAGES.COMMON.LABELS.CANCEL" | translate }}
                </button>
            </div>
        </div>
    </div>
</div>

<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>
