<page-title *ngIf="!isReport"
            [title]="pageTitle | translate"
            [breadcrumbItems]="[{ label: pageTitle | translate,  active: true }]"></page-title>

<page-title
        *ngIf="isReport"
        [title]="pageTitle | translate"
        [breadcrumbItems]="[
            { label: 'MENUITEMS.MENU.REPORTS_LIST' | translate, link: '/jawda/school-performance/reports/CSEQA', active: true },
            { label: pageTitle | translate,  active: true }]"></page-title>

<!-- grid table -->
<div class="card shadow-sm p-3">
    <div *ngIf="!isReport">
        <div class="card-body d-flex justify-content-end mx-0 px-0" *hasPermission="[Permission.VISIT_PLAN_CREATE]">
            <button class="btn btn-primary" (click)="addNewPlan()">
                <i class="ri-add-line align-bottom me-1"></i> {{ 'PAGES.COMMON.LABELS.ADD' | translate }}
            </button>
        </div>
    </div>
    <oaaaqa-ag-grid [columns]="columns" [actions]="actions" [dataList]="visitPlanOverviewList"></oaaaqa-ag-grid>
</div>

<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>
