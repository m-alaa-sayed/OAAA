<app-score-table [editable]="editable" [scores]="qualityAssuranceFormInfo.schoolPreparednessScores ?? {}"
                 [labels]="labels">
</app-score-table>

<div class="row m-1">
    <div class="col-md-12">
        <label class="form-label">
            {{ 'PAGES.QUALITY_ASSURANCE.LABELS.POSITIVE_ASPECTS'| translate }}
            <span *ngIf="editable" class="text-danger">*</span>
        </label>
        <textarea class="form-control" id="strengthsAnalysis" name="strengthsAnalysis" rows="5" required
                  #strengthsAnalysis="ngModel" [disabled]="!editable"
                  [(ngModel)]="qualityAssuranceFormInfo.schoolPreparednessScores!.strengthsAnalysis"
                  [ngClass]="{'is-invalid': isSubmitted && (strengthsAnalysis?.invalid || !qualityAssuranceFormInfo.schoolPreparednessScores!.strengthsAnalysis || qualityAssuranceFormInfo.schoolPreparednessScores!.strengthsAnalysis.trim() === '')}">
        </textarea>
        <div class="invalid-feedback"
             *ngIf="isSubmitted && (strengthsAnalysis?.invalid || !qualityAssuranceFormInfo.schoolPreparednessScores!.strengthsAnalysis || qualityAssuranceFormInfo.schoolPreparednessScores!.strengthsAnalysis.trim() === '')">
            <span>{{ 'PAGES.COMMON.MESSAGES.FIELD_REQUIRED' | translate }}</span>
        </div>
    </div>
</div>

<div class="row m-1">
    <div class="col-md-12">
        <label class="form-label">
            {{ 'PAGES.QUALITY_ASSURANCE.LABELS.IMPROVEMENT_ASPECTS'| translate }}
            <span *ngIf="editable" class="text-danger">*</span>
        </label>
        <textarea class="form-control" id="improvementsAnalysis" name="improvementsAnalysis" rows="5" required
                  #improvementsAnalysis="ngModel" [disabled]="!editable"
                  [(ngModel)]="qualityAssuranceFormInfo.schoolPreparednessScores!.improvementsAnalysis"
                  [ngClass]="{'is-invalid': isSubmitted && (improvementsAnalysis?.invalid || !qualityAssuranceFormInfo.schoolPreparednessScores!.improvementsAnalysis || qualityAssuranceFormInfo.schoolPreparednessScores!.improvementsAnalysis.trim() === '')}">
        </textarea>
        <div class="invalid-feedback"
             *ngIf="isSubmitted && (improvementsAnalysis?.invalid || !qualityAssuranceFormInfo.schoolPreparednessScores!.improvementsAnalysis || qualityAssuranceFormInfo.schoolPreparednessScores!.improvementsAnalysis.trim() === '')">
            <span>{{ 'PAGES.COMMON.MESSAGES.FIELD_REQUIRED' | translate }}</span>
        </div>
    </div>
</div>


<div class="pt-2 mx-3 d-flex justify-content-between">

    <div class="d-flex justify-content-start rounded">
        <button type="button" class="step-prev btn btn-primary" (click)="previous()">
            {{ 'PAGES.COMMON.LABELS.PREVIOUS' | translate }}
        </button>
    </div>


    <div class="d-flex justify-content-end rounded">
        <button type="button" class="btn btn-primary" (click)="next()">
            {{ 'PAGES.COMMON.LABELS.NEXT' | translate }}
        </button>
    </div>

</div>
