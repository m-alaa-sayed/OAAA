<app-score-table 
  [scores]="qualityAssuranceFormInfo.visitReportEvaluationScores  ?? {}"
  [labels]="labels" [editable]="editable">
</app-score-table>

<div class="row m-1">
    <div class="col-md-12">
        <label class="form-label">
            {{ 'PAGES.QUALITY_ASSURANCE.LABELS.OTHER_NOTES'| translate }}
        </label>
        <textarea class="form-control" name="editorAr" [disabled]="!editable" [(ngModel)]="qualityAssuranceFormInfo.visitReportEvaluationScores!.notes" rows="5">
        </textarea>
    </div>
</div>

<div  class="pt-2 mx-3 d-flex justify-content-between">

    <div class="d-flex justify-content-start rounded">
        <button  type="button" class="step-prev btn btn-primary" (click)="previous()">
            {{ 'PAGES.COMMON.LABELS.PREVIOUS' | translate }}
        </button>        
    </div>

</div>
