<div class="card dashboard-print-card">
  <div class="card-header">
    <h5 class="card-title">{{ 'PAGES.DASHBOARD.OQF.LABELS.CARD_ACTIVITIES' | translate }}</h5>
  </div>
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="d-flex align-items-center gap-2">
        <label class="mb-0">{{ 'PAGES.DASHBOARD.OQF.LABELS.YEAR' | translate }}</label>
        <select class="form-select form-select-sm w-auto" [value]="selectedYear === null ? '' : selectedYear" (change)="onYearChange($any($event.target).value)">
          <option *ngFor="let option of yearOptions" [value]="option.value === null ? '' : option.value">
            {{ option.labelKey ? (option.labelKey | translate) : option.label }}
          </option>
        </select>
      </div>
      <div class="d-flex gap-2 dashboard-print-actions">
        <button type="button" class="btn btn-primary btn-sm" (click)="exportPdf()" [disabled]="isExporting">
          {{ !isExporting ? ('PAGES.DASHBOARD.OQF.LABELS.EXPORT_PDF' | translate) : ('PAGES.COMMON.LABELS.LOADING' | translate) }}
        </button>
        <button type="button" class="btn btn-primary btn-sm" (click)="exportExcel()" [disabled]="isExporting">
          {{ !isExporting ? ('PAGES.DASHBOARD.OQF.LABELS.EXPORT_EXCEL' | translate) : ('PAGES.COMMON.LABELS.LOADING' | translate) }}
        </button>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-6 col-xl-4" *ngFor="let donut of donutCards">
        <div class="card h-100">
          <div class="card-body">
            <app-donut-chart
              [title]="donut.title"
              [series]="donut.series"
              [labels]="donutLabels"
              [colors]="donutColors"
              [totalLabel]="'PAGES.DASHBOARD.OQF.LABELS.TOTAL_REVIEWERS' | translate"
              [totalValue]="donut.total"
              [height]="280">
            </app-donut-chart>
          </div>
        </div>
      </div>
    </div>

    <oaaaqa-ag-grid
      [dataList]="tableData"
      [columns]="columns"
      [showRowNumbers]="false"
      [enableColumnFilters]="false"
      [sizeColumnsToFit]="true"
      [pagination]="false">
    </oaaaqa-ag-grid>
  </div>
</div>
