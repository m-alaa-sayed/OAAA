<div class="card dashboard-print-card">
  <div class="card-header">
    <h5 class="card-title">{{ 'PAGES.DASHBOARD.CHEQA.LABELS.CARD_JOIN_REQUESTS' | translate }}</h5>
  </div>
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="d-flex align-items-center gap-2">
        <label class="mb-0">{{ 'PAGES.DASHBOARD.CHEQA.LABELS.YEAR' | translate }}</label>
        <select class="form-select form-select-sm w-auto" [value]="selectedYear"
          (change)="onYearChange($any($event.target).value === '' ? null : +($any($event.target).value))">
          <option *ngFor="let option of yearOptions" [value]="option.value">{{ option.labelKey ? (option.labelKey | translate) : option.label }}</option>
        </select>
      </div>
      <div class="d-flex gap-2 dashboard-print-actions">
        <button type="button" class="btn btn-primary btn-sm" (click)="exportPdf()" [disabled]="isExporting">
          {{ !isExporting ? ('PAGES.DASHBOARD.CHEQA.LABELS.EXPORT_PDF' | translate) : ('PAGES.COMMON.LABELS.LOADING' | translate) }}
        </button>
        <button type="button" class="btn btn-primary btn-sm" (click)="exportExcel()" [disabled]="isExporting">
          {{ !isExporting ? ('PAGES.DASHBOARD.CHEQA.LABELS.EXPORT_EXCEL' | translate) : ('PAGES.COMMON.LABELS.LOADING' | translate) }}
        </button>
      </div>
    </div>

    <oaaaqa-ag-grid [dataList]="dataList" [columns]="columns" [showRowNumbers]="false"
      [enableColumnFilters]="false" [sizeColumnsToFit]="true" [pagination]="false">
    </oaaaqa-ag-grid>

    <app-stacked-bar-chart [series]="chartSeries" [categories]="chartCategories" [dataLabelsEnabled]="true"
      [colors]="chartColors">
    </app-stacked-bar-chart>
  </div>
</div>
