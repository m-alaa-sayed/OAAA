<div class="card dashboard-print-card">
  <div class="card-header">
    <h5 class="card-title">{{ 'PAGES.DASHBOARD.CHEQA.LABELS.CARD_YEAR_COMPARISON' | translate }}</h5>
  </div>
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="d-flex flex-wrap gap-2">
        <select class="form-select form-select-sm w-auto" [value]="previousYear" (change)="onPreviousYearChange($any($event.target).value)">
          <option *ngFor="let year of yearOptions" [value]="year">{{ year }}</option>
        </select>
        <select class="form-select form-select-sm w-auto" [value]="currentYear" (change)="onCurrentYearChange($any($event.target).value)">
          <option *ngFor="let year of yearOptions" [value]="year">{{ year }}</option>
        </select>
        <select class="form-select form-select-sm w-auto" [value]="reviewerType" (change)="onReviewerTypeChange($any($event.target).value)">
          <option *ngFor="let type of reviewerTypeOptions" [value]="type.value">{{ type.labelKey | translate }}</option>
        </select>
        <select class="form-select form-select-sm w-auto" [value]="region" (change)="onRegionChange($any($event.target).value)">
          <option *ngFor="let regionOption of regionOptions" [value]="regionOption.value">{{ regionOption.labelKey | translate }}</option>
        </select>
      </div>
      <div class="d-flex gap-2 dashboard-print-actions">
        <button type="button" class="btn btn-primary btn-sm" (click)="exportPdf()" [disabled]="isExporting">
          {{ !isExporting ? ('PAGES.DASHBOARD.CHEQA.LABELS.EXPORT_PDF' | translate) : ('PAGES.COMMON.LABELS.LOADING' | translate) }}
        </button>
        <button type="button" class="btn btn-primary btn-sm" (click)="exportExcel()" [disabled]="isExporting">
          {{ !isExporting ? ('PAGES.DASHBOARD.CHEQA.LABELS.EXPORT_EXCEL' | translate) : ('PAGES.COMMON.LABELS.LOADING' | translate) }}
        </button>
      </div>
    </div>

    <oaaaqa-ag-grid [dataList]="tableData" [columns]="columns" [showRowNumbers]="false"
      [enableColumnFilters]="false" [sizeColumnsToFit]="true" [pagination]="false">
    </oaaaqa-ag-grid>

    <app-grouped-bar-chart [series]="series" [categories]="categories" [dataLabelsEnabled]="true"
      [colors]="chartColors">
    </app-grouped-bar-chart>
  </div>
</div>
