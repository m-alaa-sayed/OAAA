<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>

<page-title [title]="'PAGES.USER_MANAGEMENT_ADMIN.TITLES.PERMISSIONS_LIST' | translate" [breadcrumbItems]="breadCrumbItems"></page-title>


<!-- Permissions Grid -->
<div class="card mt-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0">{{ 'PAGES.USER_MANAGEMENT_ADMIN.LABELS.PERMISSIONS_LIST' | translate }}</h4>
        <button type="button" class="btn btn-primary" (click)="addPermission()">{{ 'PAGES.USER_MANAGEMENT_ADMIN.LABELS.ADD_PERMISSION' | translate }}</button>
    </div>
    <div class="card-body">        
        <oaaaqa-ag-grid
            [dataList]="permissionsList"
            [columns]="columns"
            [actions]="actions"
            [pagination]="true"
            [paginationPageSize]="10"
            [paginationPageSizeSelector]="[5, 10, 20]"
            [showRowNumbers]="true"
            [actionsColumnWidth]="150">
        </oaaaqa-ag-grid>
    </div>
</div>
